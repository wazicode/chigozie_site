{% extends "base.html" %}
{% block title %}Contact | {{ p.name }}{% endblock %}
{% block content %}
<section class="page">
  <div class="wrap">
    <h1 class="page-title">Let's talk</h1>
    {% if p.form_endpoint %}
    <form method="post" action="{{ p.form_endpoint }}" class="form">
      <label>Name<input name="name" required maxlength="100"></label>
      <label>Email<input type="email" name="email" required maxlength="150"></label>
      <label>Message<textarea name="message" rows="6" required maxlength="3000"></textarea></label>
      <button class="pill solid" type="submit">Send message</button>
    </form>
    {% endif %}
    <div class="links">
      <a class="pill" href="{{ p.github }}" target="_blank" rel="noopener">GitHub</a>
      <a class="pill" href="{{ p.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      {% if p.email %}<a class="pill" href="mailto:{{ p.email }}">Email</a>{% endif %}
    </div>
  </div>
</section>
{% endblock %}
